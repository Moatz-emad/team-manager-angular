<div class="login-page">

  <div class="login-card">

    <div class="welcome-section">
      <h1>Welcome to EduHub 🎓</h1>
      <p>Learn, grow, and build your future with us.</p>
    </div>

    <div class="login-section">
      <h2>Welcome Back!</h2>
      <p class="subtitle">Login to continue your learning journey.</p>

      <form (ngSubmit)="login()">

        <label>Email</label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        >

        <label>Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        >

        <button type="submit">
          Login
        </button>

      </form>
    </div>

  </div>

</div>
