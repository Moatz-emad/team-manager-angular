<div class="login-container">

  <h1>EduHub</h1>

  <h2>Login</h2>

  <form (ngSubmit)="login()">

    <label>Email</label>

    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>

    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      placeholder="Enter your password"
      required
    >

    <button type="submit">
      Login
    </button>

  </form>

</div>
